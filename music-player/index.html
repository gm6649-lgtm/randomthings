<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="description" content="Indian Music Player - Play your favorite Indian songs from 1970s to 2024">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Sangeet - Indian Music Player</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="app-header">
      <div class="header-left">
        <svg class="logo-icon" viewBox="0 0 24 24" width="28" height="28">
          <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
          <circle cx="12" cy="12" r="3" fill="currentColor"/>
          <path d="M12 2 L12 5 M12 19 L12 22 M2 12 L5 12 M19 12 L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <h1 class="app-title">Sangeet</h1>
      </div>
      <button class="search-toggle-btn" id="searchToggleBtn" aria-label="Search">
        <svg viewBox="0 0 24 24" width="22" height="22">
          <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
          <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </header>

    <!-- Search Bar -->
    <div class="search-bar" id="searchBar">
      <div class="search-input-wrapper">
        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18">
          <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
          <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input type="text" id="searchInput" placeholder="Search songs, artists, movies..." autocomplete="off">
        <button class="search-clear-btn" id="searchClearBtn" aria-label="Clear search">
          <svg viewBox="0 0 24 24" width="18" height="18">
            <line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <nav class="tab-nav" id="tabNav">
      <button class="tab-btn active" data-tab="browse">Browse</button>
      <button class="tab-btn" data-tab="decades">Decades</button>
      <button class="tab-btn" data-tab="playlist">Playlist</button>
      <button class="tab-btn" data-tab="video">Videos</button>
    </nav>

    <!-- Main Content -->
    <main class="main-content" id="mainContent">
      <!-- Browse Tab -->
      <section class="tab-content active" id="browseTab">
        <div class="section-header">
          <h2>Featured Songs</h2>
        </div>
        <div class="song-list" id="featuredList"></div>

        <div class="section-header">
          <h2>Recently Added</h2>
        </div>
        <div class="song-list" id="recentList"></div>

        <div class="section-header">
          <h2>All Songs</h2>
        </div>
        <div class="song-list" id="allSongsList"></div>
      </section>

      <!-- Decades Tab -->
      <section class="tab-content" id="decadesTab">
        <div class="decades-grid" id="decadesGrid"></div>
        <div class="song-list" id="decadeSongsList"></div>
      </section>

      <!-- Playlist Tab -->
      <section class="tab-content" id="playlistTab">
        <div class="playlist-header">
          <h2>My Playlist</h2>
          <span class="playlist-count" id="playlistCount">0 songs</span>
        </div>
        <div class="song-list" id="playlistSongsList"></div>
        <div class="empty-state" id="playlistEmpty">
          <svg viewBox="0 0 24 24" width="48" height="48">
            <path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z" fill="none" stroke="currentColor" stroke-width="1.5"/>
          </svg>
          <p>Your playlist is empty</p>
          <span>Tap the + button on any song to add it here</span>
        </div>
      </section>

      <!-- Videos Tab -->
      <section class="tab-content" id="videoTab">
        <div class="section-header">
          <h2>Music Videos</h2>
        </div>
        <div class="video-grid" id="videoGrid"></div>
      </section>

      <!-- Search Results -->
      <section class="tab-content" id="searchResults">
        <div class="section-header">
          <h2>Search Results</h2>
          <span class="result-count" id="resultCount"></span>
        </div>
        <div class="song-list" id="searchResultsList"></div>
        <div class="empty-state" id="searchEmpty">
          <svg viewBox="0 0 24 24" width="48" height="48">
            <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/>
            <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <p>No results found</p>
          <span>Try a different search term</span>
        </div>
      </section>
    </main>

    <!-- Video Player Modal -->
    <div class="video-modal" id="videoModal">
      <div class="video-modal-content">
        <button class="video-close-btn" id="videoCloseBtn" aria-label="Close video">
          <svg viewBox="0 0 24 24" width="24" height="24">
            <line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
        <video id="videoPlayer" controls playsinline>
          Your browser does not support video playback.
        </video>
        <div class="video-info" id="videoInfo">
          <h3 id="videoTitle"></h3>
          <p id="videoArtist"></p>
        </div>
      </div>
    </div>

    <!-- Bottom Player Bar -->
    <div class="player-bar" id="playerBar">
      <div class="player-progress-bar" id="playerProgressBar">
        <div class="player-progress" id="playerProgress"></div>
      </div>
      <div class="player-info" id="playerInfo">
        <div class="player-artwork" id="playerArtwork">
          <svg viewBox="0 0 24 24" width="24" height="24">
            <path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z" fill="currentColor"/>
          </svg>
        </div>
        <div class="player-details">
          <span class="player-song-title" id="playerSongTitle">No song playing</span>
          <span class="player-song-artist" id="playerSongArtist">Tap a song to play</span>
        </div>
      </div>
      <div class="player-controls">
        <button class="player-btn" id="prevBtn" aria-label="Previous">
          <svg viewBox="0 0 24 24" width="22" height="22">
            <polygon points="19,20 9,12 19,4" fill="currentColor"/>
            <rect x="5" y="4" width="2" height="16" fill="currentColor"/>
          </svg>
        </button>
        <button class="player-btn play-btn" id="playPauseBtn" aria-label="Play">
          <svg viewBox="0 0 24 24" width="28" height="28" id="playIcon">
            <polygon points="6,3 20,12 6,21" fill="currentColor"/>
          </svg>
          <svg viewBox="0 0 24 24" width="28" height="28" id="pauseIcon" style="display:none">
            <rect x="5" y="3" width="4" height="18" rx="1" fill="currentColor"/>
            <rect x="15" y="3" width="4" height="18" rx="1" fill="currentColor"/>
          </svg>
        </button>
        <button class="player-btn" id="nextBtn" aria-label="Next">
          <svg viewBox="0 0 24 24" width="22" height="22">
            <polygon points="5,4 15,12 5,20" fill="currentColor"/>
            <rect x="17" y="4" width="2" height="16" fill="currentColor"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Audio Element -->
    <audio id="audioPlayer" preload="metadata"></audio>
  </div>

  <script src="js/catalog.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
